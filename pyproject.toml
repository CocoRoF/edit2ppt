[project]
name = "edit2ppt"
version = "0.3.0"
description = "AI-agent-native PPT generation server with Korean language support. Forked from ppt-master (MIT)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "edit2ppt contributors"}]
keywords = ["pptx", "presentation", "ai-agent", "mcp", "korean"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "sse-starlette>=2.1.3",
    # i18n
    "pyyaml>=6.0",
    # Storage
    "aioboto3>=13.2.0",
    "botocore>=1.35.0",
    # Database. Standalone mode (the default) uses SQLite via aiosqlite;
    # `EDIT2PPT_DATABASE_URL=postgresql+asyncpg://...` switches to Postgres.
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Job queue
    "arq>=0.26.1",
    "redis>=5.2.0",
    # Logging
    "structlog>=24.4.0",
    # Core engine dependencies (from ppt-master)
    "python-pptx>=0.6.21",
    "PyMuPDF>=1.23.0",
    "mammoth>=1.6.0",
    "openpyxl>=3.1.0",
    "nbconvert>=7.0.0",
    "markdownify>=0.11.6",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "Pillow>=9.0.0",
    "numpy>=1.20.0",
    "lxml>=5.3.0",
    # TTS
    "edge-tts>=7.2.8",
    # LLM
    "anthropic>=0.40.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "pyright>=1.1.388",
    "pre-commit>=4.0.0",
]
images = [
    # AI image generation backends — optional. Each gated by env var.
    "google-genai>=1.0.0",
    "openai>=1.55.0",
]
svg-fallback = [
    # SVG -> PNG fallback for legacy Office. Pick one.
    "cairosvg>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/CocoRoF/edit2ppt"
Issues = "https://github.com/CocoRoF/edit2ppt/issues"
Upstream = "https://github.com/hugohe3/ppt-master"

[project.scripts]
edit2ppt = "edit2ppt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edit2ppt"]

[tool.hatch.build.targets.wheel.sources]
"src/edit2ppt" = "edit2ppt"

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "src/edit2ppt/core",  # ppt-master fork; lint separately if/when we rewrite
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E402"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: hits external services (LLM, image, TTS)",
    "slow: takes more than ~5s",
]

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["src/edit2ppt", "tests"]
exclude = [
    "src/edit2ppt/core",  # ppt-master fork has its own conventions
    "**/__pycache__",
    ".venv",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
